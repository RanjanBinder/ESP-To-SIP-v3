<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Library — Indian Railways ESP · SIP · LOP Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
    #root { height: 100vh; }
  </style>
  <script src="react.js"></script>
  <script src="react-dom.js"></script>
  <script src="xlsx.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('root');
      if (el && !el.childElementCount) {
        el.innerHTML = '<div style="font-family:sans-serif;padding:32px;color:#c00"><strong>App error:</strong> ' + msg + '<br><small>' + src + ':' + line + '</small></div>';
      }
    };
  </script>

  <!-- Load design-system components in dependency order -->
  <script src="icons.js"></script>
  <script src="components-forms.js"></script>
  <script src="components-data.js"></script>
  <script src="components-nav.js"></script>

  <!-- Tweaks panel -->
  <script src="tweaks-panel.js"></script>

  <!-- Dashboard screen (embedded inside shared sidebar navigation) -->
  <script>window.__EMBED_DASHBOARD_PAGE = true;</script>
  <script src="dashboard.js"></script>

  <!-- Station Hub screen -->
  <script src="station-hub.js"></script>

  <!-- Workspace screen -->
  <script src="workspace.js"></script>

  <!-- Digital Library screen -->
  <script src="digital-library.js"></script>
</body>
</html>
