  <style>
/* ESP-SIP Design System — tokens */
:root {
  /* Brand */
  --ink-900: #0E1B2C;
  --ink-800: #182838;
  --ink-700: #2A3B4E;
  --ink-600: #475569;
  --ink-500: #64748B;
  --ink-400: #94A3B8;
  --ink-300: #CBD3DC;
  --ink-200: #E4E8EE;
  --ink-100: #EFF2F6;
  --ink-50:  #F6F8FA;

  --canvas: #FAFAF7;
  --paper:  #FFFFFF;

  --accent:        #3737c8;
  --accent-hover:  #2b2bad;
  --accent-active: #232391;
  --accent-soft:   #ebebf9;
  --accent-text:   #2929a0;

  --stripe-blue-950: #06182C;
  --stripe-blue-900: #0A2540;
  --stripe-blue-800: #12395B;
  --stripe-blue-700: #174A73;
  --stripe-cyan: #00D4FF;
  --stripe-violet: #3737c8;
  --sidebar-bg: linear-gradient(180deg, #0A2540 0%, #0D335F 52%, #174A73 100%);
  --sidebar-glow: radial-gradient(circle at 18% 0%, rgba(99,91,255,0.38), transparent 34%), radial-gradient(circle at 100% 24%, rgba(0,212,255,0.20), transparent 30%);
  --sidebar-border: rgba(255,255,255,0.12);
  --sidebar-text: #FFFFFF;
  --sidebar-muted: #ADBDCC;
  --sidebar-item: rgba(255,255,255,0.06);
  --sidebar-item-hover: rgba(255,255,255,0.12);
  --sidebar-item-active: #FFFFFF;
  --sidebar-item-active-text: #0A2540;

  --success:      oklch(0.62 0.13 155);
  --success-soft: oklch(0.96 0.04 155);
  --success-text: oklch(0.42 0.12 155);

  --warning:      oklch(0.78 0.13 78);
  --warning-soft: oklch(0.97 0.05 85);
  --warning-text: oklch(0.45 0.10 70);

  --danger:       oklch(0.60 0.18 25);
  --danger-soft:  oklch(0.96 0.04 25);
  --danger-text:  oklch(0.45 0.16 25);

  --info:         oklch(0.62 0.13 240);
  --info-soft:    oklch(0.96 0.04 240);
  --info-text:    oklch(0.42 0.13 240);

  --neutral-soft: var(--ink-100);
  --neutral-text: var(--ink-600);

  /* Radii */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-full: 999px;

  /* Shadow */
  --shadow-xs: 0 1px 0 rgba(14,27,44,0.04);
  --shadow-sm: 0 1px 2px rgba(14,27,44,0.06), 0 1px 0 rgba(14,27,44,0.03);
  --shadow-md: 0 4px 12px -2px rgba(14,27,44,0.08), 0 2px 4px -1px rgba(14,27,44,0.04);
  --shadow-lg: 0 16px 32px -8px rgba(14,27,44,0.14), 0 4px 8px -2px rgba(14,27,44,0.06);
  --shadow-focus: 0 0 0 3px rgba(55,55,200,0.22);

  /* Spacing */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-7: 32px; --s-8: 40px; --s-9: 56px;

  /* Type */
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;

  /* Borders */
  --hairline: 1px solid var(--ink-200);
  --hairline-strong: 1px solid var(--ink-300);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--ink-900);
  background: var(--canvas);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01", "ss03";
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
::selection { background: var(--accent-soft); color: var(--accent-text); }

/* Subtle scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink-200); border-radius: 999px; border: 2px solid var(--canvas); }
::-webkit-scrollbar-thumb:hover { background: var(--ink-300); }

/* Helpers */
.mono { font-family: var(--font-mono); font-feature-settings: normal; }
.hairline { border: var(--hairline); }
.muted { color: var(--ink-500); }
.tabular { font-variant-numeric: tabular-nums; }

/* Icons (currentColor strokes) */
.icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.icon-sm { width: 14px; height: 14px; }
.icon-lg { width: 20px; height: 20px; }
  </style>
