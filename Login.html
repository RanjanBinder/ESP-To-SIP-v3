<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pragathi Rail — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 5.5%;
      background: #0d1525;
    }

    .login-bg {
      position: fixed;
      inset: 0;
      background-image: url('assets/login-bg.png');
      background-size: cover;
      background-position: center;
      background-color: #0d1525;
      z-index: 0;
    }

    /* Card */
    .login-card {
      position: relative;
      z-index: 1;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35), 0 4px 20px rgba(0,0,0,0.15);
      width: 420px;
      max-width: calc(100vw - 32px);
      padding: 36px 40px 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Logo + Welcome */
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .logo-img {
      height: 72px;
      width: auto;
      object-fit: contain;
    }

    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.2px;
      line-height: 34px;
      text-align: center;
    }

    /* Form */
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .fields-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      display: flex;
      gap: 1px;
      align-items: baseline;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: #111827;
    }

    .field-label .required {
      color: #f15b50;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 11px 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-wrap:focus-within {
      border-color: #3737c8;
      box-shadow: 0 0 0 3px rgba(55,55,200,0.08);
    }

    .input-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .input-icon svg { width: 100%; height: 100%; }

    .input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #111827;
      line-height: 20px;
      background: transparent;
      min-width: 0;
    }

    .input-wrap input::placeholder { color: #9ca3af; }

    .eye-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: #9ca3af;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    .eye-btn svg { width: 100%; height: 100%; }

    /* Remember + Forgot */
    .remember-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .remember-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: #3737c8;
      border: 1px solid #3737c8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .checkbox svg { width: 12px; height: 12px; }

    .remember-label {
      font-size: 14px;
      font-weight: 400;
      color: #374151;
      line-height: 20px;
      white-space: nowrap;
    }

    .forgot-link {
      font-size: 14px;
      font-weight: 500;
      color: #3737c8;
      line-height: 20px;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .forgot-link:hover { text-decoration: underline; }

    /* Buttons */
    .buttons-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .btn-login {
      width: 100%;
      background: #3737c8;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }

    .btn-login:hover { background: #2b2bad; }
    .btn-login:active { background: #232391; }

    .or-divider {
      font-size: 14px;
      font-weight: 400;
      color: #9ca3af;
      line-height: 20px;
      text-align: center;
    }

    .btn-sso {
      width: 100%;
      background: transparent;
      color: #3737c8;
      border: 1px solid #3737c8;
      border-radius: 8px;
      padding: 11px 16px;
      font-family: 'Roboto', sans-serif;
      font-size: 15px;
      font-weight: 500;
      line-height: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-sso:hover { background: rgba(55,55,200,0.04); }
    .btn-sso svg { width: 18px; height: 18px; flex-shrink: 0; }

    @media (max-width: 768px) {
      body { padding-right: 0; justify-content: center; }
      .login-card { margin: 16px; }
    }
  </style>
</head>
<body>

  <div class="login-bg"></div>

  <div class="login-card">

    <!-- Logo + Welcome -->
    <div class="logo-section">
      <img src="assets/pragathi-rail-logo.png" alt="Pragathi Rail" class="logo-img" />
      <p class="welcome-title">Welcome Back</p>
    </div>

    <!-- Form -->
    <div class="form-section">

      <div class="fields-group">

        <!-- Username -->
        <div class="field">
          <div class="field-label">
            <span>Username</span><span class="required">&thinsp;*</span>
          </div>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 10C12.2091 10 14 8.20914 14 6C14 3.79086 12.2091 2 10 2C7.79086 2 6 3.79086 6 6C6 8.20914 7.79086 10 10 10Z" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17 18C17 15.2386 13.866 13 10 13C6.13401 13 3 15.2386 3 18" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <input type="text" id="username" placeholder="sarath" autocomplete="username" />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <div class="field-label">
            <span>Password</span><span class="required">&thinsp;*</span>
          </div>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="9" width="14" height="10" rx="2" stroke="#9ca3af" stroke-width="1.5"/>
                <path d="M7 9V6C7 3.79086 8.34315 2 10 2C11.6569 2 13 3.79086 13 6V9" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password" />
            <button class="eye-btn" onclick="togglePassword()" aria-label="Toggle password visibility">
              <svg id="eye-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 10C2 10 5 4 10 4C15 4 18 10 18 10C18 10 15 16 10 16C5 16 2 10 2 10Z" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.5" stroke="#9ca3af" stroke-width="1.5"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me + Forgot Password -->
        <div class="remember-row">
          <div class="remember-left">
            <div class="checkbox" onclick="toggleRemember(this)" role="checkbox" aria-checked="true" tabindex="0">
              <svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 6L5 9L10 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="remember-label">Keep me signed in</span>
          </div>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

      </div>

      <!-- CTA Buttons -->
      <div class="buttons-group">
        <button class="btn-login" onclick="handleLogin()">Login</button>
        <span class="or-divider">Or</span>
        <button class="btn-sso" onclick="handleSSO()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="#3737c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Login with SSO
        </button>
      </div>

    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function toggleRemember(el) {
      const checked = el.getAttribute('aria-checked') === 'true';
      el.setAttribute('aria-checked', String(!checked));
      el.style.background = !checked ? '#3737c8' : '#ffffff';
      el.style.border = !checked ? '1px solid #3737c8' : '1px solid #d1d5db';
      el.innerHTML = !checked
        ? `<svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
             <path d="M2 6L5 9L10 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
           </svg>`
        : '';
    }

    function handleLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (!username || !password) {
        alert('Please enter your username and password.');
        return;
      }
      window.location.href = 'Dashboard.html';
    }

    function handleSSO() {
      alert('SSO login is not configured.');
    }
  </script>

</body>
</html>
